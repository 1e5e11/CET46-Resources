function switchSource(){
 stopAudio();files=mergedFiles($('source').value);
 const selected=$('year').value;const years=[...new Set(files.map(f=>f.year))].sort().reverse();$('year').replaceChildren(create('option','','全部年份'));$('year').firstChild.value='';for(const year of years){const option=create('option','',year);option.value=year;$('year').append(option);}if(years.includes(selected))$('year').value=selected;
 try{const url=new URL(location.href);if($('source').value==='default')url.searchParams.delete('source');else url.searchParams.set('source','uploaded');history.replaceState(null,'',url);}catch{}
 render();
}
function render(){
 stopAudio();const q=$('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean);const filtered=files.filter(f=>(!$('level').value||f.level===$('level').value)&&(!$('year').value||f.year===$('year').value)&&(!$('type').value||f.category===$('type').value)&&q.every(term=>(f.level+' '+f.session+' '+f.name+' '+f.category+' '+(f.set?'第'+f.set+'套':'')).toLowerCase().includes(term)));
 const groups=new Map();for(const file of filtered){const key=file.level+'|'+file.session;if(!groups.has(key))groups.set(key,{key,level:file.level,session:file.session,files:[]});groups.get(key).files.push(file);}
 const sessions=[...groups.values()].sort((a,b)=>b.session.localeCompare(a.session)||(a.level==='四级'?-1:1));
 $('status').textContent=DATA[$('source').value].label+' · 缺项自动补齐 · '+sessions.length+' 个场次 · '+filtered.length+' 个文件';$('content').replaceChildren();
 if(!sessions.length){$('content').append(create('div','empty','没有符合条件的资料'));return;}
 const fragment=document.createDocumentFragment();
 sessions.forEach((session,index)=>{const card=create('details','session');card.open=sessions.length<=6||index<2;const summary=create('summary','',session.session+' · '+session.level);summary.append(create('span','',session.files.length+' 份'));card.append(summary);const body=create('div','body');
 for(const category of order){const matches=session.files.filter(f=>f.category===category).sort((a,b)=>a.name.localeCompare(b.name,'zh-CN',{numeric:true}));if(!matches.length)continue;const section=create('section','category');section.append(create('h3','',names[category]));
 for(const file of matches){const row=create('div','file');const audio=category==='听力音频';const label=file.set?'第 '+file.set.replace('-','–')+' 套'+(/WeHUSTER版|CET通版/.exec(file.name)?.[0]?' · '+/WeHUSTER版|CET通版/.exec(file.name)[0]:''):file.name;const link=create('a','file-name',label);link.href=audio?rawURL(file):openURL(file);link.target='_blank';link.rel='noopener';link.title=file.name+(file.origin!==$('source').value?'（另一源补齐）':'');row.append(link,create('span','size',sizeLabel(file.size)));
 if(audio){const play=create('button','plain','播放');play.type='button';play.setAttribute('aria-label','播放 '+session.session+' '+session.level+' '+label);let player;play.addEventListener('click',()=>{if(player){player.querySelector('audio').pause();player.remove();player=null;play.textContent='播放';return;}stopAudio();player=create('div','player');const control=create('audio');control.controls=true;control.preload='none';control.src=rawURL(file);control.setAttribute('aria-label',file.name);player.append(control);row.after(player);play.textContent='收起';control.play().catch(()=>{});});row.append(play);}
 const download=create('a','','下载');download.href=downloadURL(file);download.setAttribute('download',file.name);row.append(download);section.append(row);}
 body.append(section);}
 const note=DATA.uploaded.notes?.[session.key];if(note)body.append(create('p','note',note));card.append(body);card.addEventListener('toggle',()=>{if(!card.open)card.querySelectorAll('audio').forEach(audio=>audio.pause());});fragment.append(card);});$('content').append(fragment);
}
const source=new URL(location.href).searchParams.get('source');if(source==='uploaded')$('source').value=source;
$('source').addEventListener('change',switchSource);['level','year','type'].forEach(id=>$(id).addEventListener('change',render));$('search').addEventListener('input',render);$('reset').addEventListener('click',()=>{['level','year','type','search'].forEach(id=>$(id).value='');render();});switchSource();
</script></body></html>
